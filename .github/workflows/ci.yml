name: CI

on: [push, pull_request]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Системные библиотеки Qt (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libxkbcommon0 libgl1 libdbus-1-3 libfontconfig1
      - name: Зависимости
        run: python -m pip install -r requirements.txt pytest pyflakes
      - name: Статическая проверка
        run: python -m pyflakes app main.py
      - name: Тесты
        run: python -m pytest -q tests

  build-windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt pyinstaller
      - run: python -m PyInstaller --noconfirm CloudSaveManager.spec
      - uses: actions/upload-artifact@v4
        with:
          name: CloudSaveManager-windows
          path: dist/CloudSaveManager.exe
